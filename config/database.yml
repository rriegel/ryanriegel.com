default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DATABASE_PORT") { 5434 } %>
  username: <%= ENV.fetch("DATABASE_USERNAME") { "postgres" } %>
  password: <%= ENV["DATABASE_PASSWORD"] %>

development:
  <<: *default
  database: ryanriegel_com_development

test:
  <<: *default
  database: ryanriegel_com_test

production:
  <<: *default
  database: ryanriegel_com_production
  username: ryanriegel
  password: <%= ENV["RYANRIEGEL_COM_DATABASE_PASSWORD"] %>
